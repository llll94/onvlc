<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- a página só fala com o próprio app da TV (servidor local): nada de fora, nada embutido de outro site -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>onVLC</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="tv">
  <div class="bg" id="bg-a"></div>
  <div class="bg" id="bg-b"></div>
  <div class="shade"></div>
  <div class="bar">
    <div class="brand"><img src="icon.svg" alt="">onVLC</div>
    <div class="sp"></div>
    <div class="pill" id="busy" hidden></div>
    <div class="pill" id="pc"></div>
    <div class="btn wake" id="wake" data-k="wake" hidden>Ligar o PC</div>
    <div class="clock" id="clock"></div>
  </div>
  <main id="view"></main>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="app.js"></script>
<script src="player.js"></script>
</body>
</html>
