# Confere o código a cada push e pull request: Go compila e passa no vet/gofmt, Python sem erros de sintaxe/nomes,
# nenhuma chave ou certificado no repositório.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nenhuma chave no repositório
        shell: bash
        run: |
          if git ls-files | grep -iE '\.(keystore|jks|pem|p12|pfx|key)$'; then
            echo "chave ou certificado no repositório"; exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod

      - name: Biblioteca (Go)
        working-directory: server
        shell: bash
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go build ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python
        run: |
          python -m pip install pyflakes==3.4.0
          python -m pyflakes main.py library.py tvsetup.py tvdevices.py tvstream.py tvfolder.py winsetup.py opensubs.py thumbs.py tools
